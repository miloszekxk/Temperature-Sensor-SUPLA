[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
lib_deps =
	adafruit/Adafruit SSD1306@2.5.17
	adafruit/Adafruit GFX Library@1.13.0
	adafruit/Adafruit BMP280 Library@3.0.0
	https://github.com/SUPLA/supla-device.git#v26.9.2
